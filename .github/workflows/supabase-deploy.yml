# Spielt Migrationen, Inhalte (seed.sql) und Edge Functions in ein Supabase-Projekt ein. Bewusst nur manuell.
# Voraussetzung je GitHub-Environment (staging, production): Secrets SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD,
# Variable SUPABASE_PROJECT_REF. Ablauf und Erstkonfiguration: README „Go-Live“.
name: Supabase deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Zielumgebung
        type: choice
        options: [staging, production]
        default: staging

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_YES: '1'
      CLI: npx -y supabase@3.0.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Vorab prüfen (Schema, RLS, Functions)
        run: npm run db:check && npm run test:functions
      - name: Projekt verknüpfen
        run: $CLI link --project-ref "${{ vars.SUPABASE_PROJECT_REF }}" --password "$SUPABASE_DB_PASSWORD"
      - name: Migrationen + Inhalte
        run: $CLI db push --remote --include-seed
      - name: Edge Functions
        run: |
          $CLI functions deploy grade-attempt --use-api
          $CLI functions deploy delete-account --use-api
