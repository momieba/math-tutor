# Prüft jeden Push und Pull Request: Typen, Unit-Tests, Seed/Functions aktuell, Schema + RLS, Edge Functions, Build, E2E.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit-Tests
        run: npm test
      - name: seed.sql passt zu src/content
        run: npm run seed:sql && git diff --exit-code supabase/seed.sql
      - name: Schema, Seed und RLS (PGlite)
        run: npm run db:check
      - name: Edge Functions (synchron + Deno-Tests)
        run: npm run test:functions
      - name: Production-Build
        run: npm run build
        env:
          VITE_DATA_MODE: local
      - name: Playwright-Browser
        run: npx playwright install --with-deps chromium
      - name: E2E (iPad, lokaler Modus)
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
